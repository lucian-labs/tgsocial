<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- PUBLIC.md §1/§3 — the second wall. The parser already returns text and
       structured entities and the renderer builds nodes, so preview markup is
       never adopted into this page; this makes the browser enforce it too.
       Scripts, frames and objects are pinned to our own origin, `base-uri` and
       `form-action` are closed so injected markup cannot re-point them, and
       media/images stay open to https: because Telegram serves the preview's
       files straight off its CDN. `wasm-unsafe-eval` is what TDLib's wasm
       needs; connect-src stays broad because tdweb talks to whichever Telegram
       DC it is handed; `style-src` keeps 'unsafe-inline' because the kit sets
       element styles from JS (aspect ratios, transforms, scrubber widths) and
       the browser counts those as inline styles — a script wall is the point
       here, and no preview string ever becomes markup to carry a style. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: blob:; font-src 'self'; connect-src 'self' https: wss: blob: data:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>tgsocial</title>
  <meta name="description" content="Your Telegram, as a feed. A social network that lives entirely on Telegram.">
  <meta name="theme-color" id="theme-color" content="">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/icons/icon-64.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
  <link rel="preload" href="/vendor/fonts/KaushanScript-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/vendor/fonts/CormorantGaramond-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/vendor/house-pour.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app" id="app">
    <div class="head" id="head">
      <header class="topbar">
        <div class="topbar-lead" id="topbar-lead">
          <a class="brand" href="#/feed" aria-label="tgsocial home">tgsocial</a>
        </div>
        <button class="pill status" id="status" type="button" aria-live="polite" aria-label="Status. Opens the status sheet">Signed out</button>
      </header>
    </div>
    <main class="view" id="view" aria-live="polite"></main>
  </div>
  <nav class="dock" id="dock" hidden aria-label="Sections"></nav>
  <div id="viewer-root"></div>
  <div id="modal"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- tdweb is a webpack UMD bundle: classic script, exposes window.tdweb.default (TdClient).
       Its worker + wasm live in /vendor/tdweb/ (publicPath patched by scripts/install-tdweb.sh). -->
  <script src="/vendor/tdweb/tdweb.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
