# nginx-public.conf — the public reader's proxy (PUBLIC.md §1).
#
# tgsocial.lucianlabs.ca is a static site; this is the one thing it needs a
# server for. `t.me` sends no `Access-Control-Allow-Origin`, so a browser
# cannot fetch Telegram's public preview directly — nginx fetches it under our
# own origin and caches it. Nothing else about the deploy changes: the site is
# still files on disk with an SPA fallback.
#
# INSTALL
#   1. In the `http { }` block (nginx.conf), declare the cache zone the
#      location below uses:
#
#        proxy_cache_path /var/cache/nginx/tgpreview levels=1:2
#                         keys_zone=tgpreview:10m max_size=256m
#                         inactive=10m use_temp_path=off;
#
#   2. `include` this file inside the `server { }` block for
#      tgsocial.lucianlabs.ca — beside the `try_files $uri $uri/ /index.html`
#      that serves the SPA:
#
#        include /var/www/tgsocial/nginx-public.conf;
#
#   3. `nginx -t && systemctl reload nginx`.
#
# This file is not applied by anything in this repo. The deploy is a webhook on
# push to `main` that updates the checkout; it does not edit nginx config, so
# this include is a one-time manual step on the host, done once and then left
# alone.
#
# For local development there is no nginx: `node web/scripts/dev-proxy.mjs`
# serves web/ and proxies the same path (see web/README.md).
#
# VERIFY — no test in this repo exercises this file (web/test/smoke.mjs runs
# against the dev proxy, which is a different implementation of the same
# rules), so check it against a real nginx before touching it. Write a wrapper
# with the cache zone above, then:
#
#   docker run --rm -v $PWD/wrapper.conf:/etc/nginx/nginx.conf:ro \
#              -v $PWD/web:/var/www/tgsocial:ro nginx:alpine nginx -t
#
# and, running the same image with `-p 18080:8080`, the four things this block
# actually promises (all four measured green on 2026-08-24):
#
#   /tg/s/telegram         → 200, Content-Type: text/plain, no Set-Cookie
#   /tg/s/telegram twice   → X-Cache: MISS then HIT
#   /tg/s/telegram?q=x     → 404 (also ?before=abc, ?before=1&foo=2, ?foo=bar)
#   /tg/s/x, /tg/telegram  → 404

# TLS to t.me needs SNI, and nginx's `proxy_ssl_server_name` defaults to off —
# without this the upstream handshake fails at Telegram's edge. It is a
# server-scope directive, set here so the location below carries exactly the
# directives PUBLIC.md §1 lists and nothing else.
proxy_ssl_server_name on;

# ── the proxy: the same directives as PUBLIC.md §1, in the same order, with
#    the reasoning kept here rather than in the spec's bullet list ───────────
location /tg/s/ {
    # The query half of "a bare channel, optionally ?before=<digits>". nginx
    # matches locations against the URI with arguments stripped, so the regex
    # location below can only ever police the path — without this line
    # `/tg/s/telegram?anything=you&like` is forwarded to t.me verbatim and the
    # block is an open proxy for arguments. `return` inside `if` is one of the
    # two uses `if` is safe for.
    if ($args !~ "^(before=[0-9]+)?$") { return 404; }

    proxy_pass https://t.me/s/;
    proxy_set_header Host t.me;
    proxy_set_header User-Agent "tgsocial/1.0 (+https://tgsocial.lucianlabs.ca)";

    # t.me answers every request with `Set-Cookie: stel_ssid=…`, `Pragma:
    # no-cache` and `Cache-Control: no-store` (measured). nginx stores neither a
    # response carrying `Set-Cookie` nor one the upstream marked `no-store`, and
    # `proxy_cache_valid` does not override either — so without these two lines
    # the cache below never engages, `X-Cache` reads MISS forever, and every
    # reader is one uncached scrape of Telegram from the droplet's IP. Hiding
    # the cookie is required anyway: a Telegram session cookie has no business
    # being set on our origin.
    proxy_ignore_headers Set-Cookie Cache-Control Expires;
    proxy_hide_header Set-Cookie;

    proxy_cache tgpreview;
    proxy_cache_valid 200 60s;          # a page is a lens, not an archive
    proxy_cache_use_stale error timeout updating;
    proxy_cache_lock on;                # one upstream fetch per key, not a stampede

    # The body is Telegram's own HTML — nine <script> tags, theirs and
    # telegram.org's. To js/public/preview.js it is a STRING (source.js reads it
    # with res.text(), which does not care what type it was declared), so it is
    # served as inert text rather than as a document. A reader who opens
    # /tg/s/<channel> directly gets characters; nothing executes on the origin
    # that holds their TDLib session in IndexedDB. `sandbox` costs the fetch
    # path nothing — the directive applies to documents, not to subresources.
    proxy_hide_header Content-Type;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    add_header Content-Type "text/plain; charset=utf-8" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "sandbox; default-src 'none'" always;

    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Cache $upstream_cache_status always;
}

# ── the rules that proxy obeys, made enforceable ────────────────────────────
#
# Only `/s/`: this proxies the preview path and nothing else — not `t.me/`
# join pages, not the API. A path that is not a bare channel (optionally with
# `?before=`) is refused rather than forwarded, so the location above can never
# be used as an open proxy onto t.me.
#
# `location /tg/s/` is a prefix match and the regex location below is checked
# first by nginx's ordering rules; the `if ($args …)` guard inside the prefix
# location covers the query string, which location matching never sees. The two
# together are: "a bare channel, optionally ?before=<digits>, or 404".
# The quotes are load-bearing: nginx reads an unquoted `{` in a directive value
# as the start of a block, so `{4,32}` truncates the regex and `nginx -t` fails
# with "missing closing parenthesis" (verified against nginx:alpine).
location ~ "^/tg/s/(?![A-Za-z0-9_]{4,32}/?$)" {
    return 404;
}

# Nothing under /tg/ other than /tg/s/ exists.
location /tg/ {
    return 404;
}
