name: tgsocial
options:
  bundleIdPrefix: ca.lucianlabs
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.2"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: L62T7W4NBF
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  TDLibKit:
    url: https://github.com/Swiftgram/TDLibKit
    exactVersion: 1.5.2-tdlib-1.8.66-022d6020

targets:
  tgsocial:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # PRODUCT §5 "Mac": the same SwiftUI app built for Mac Catalyst, plus the
    # Connector tab (§2.14) and the bridge. Not a second app and not a second
    # TDLib session — one target, one codebase, one signed-in account.
    supportsMacCatalyst: true
    sources:
      - path: Sources
      - path: ../design/swift/HousePour
        name: HousePour
      - path: Resources
      - path: ../design/fonts
        name: Fonts
        buildPhase: resources
        includes:
          - "*.ttf"
    dependencies:
      - package: TDLibKit
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    settings:
      base:
        PRODUCT_NAME: tgsocial
        PRODUCT_BUNDLE_IDENTIFIER: ca.lucianlabs.tgsocial
        INFOPLIST_KEY_CFBundleDisplayName: tgsocial
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: YES
        # Catalyst runs sandboxed; the bridge needs network.server for its
        # loopback listen() and TDLib needs network.client (see the file). iOS
        # and the simulator carry no entitlements file at all — the sdk
        # condition keeps the Mac grants off the phone build.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": tgsocial-Mac.entitlements
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: tgsocial
        CFBundleName: tgsocial
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TGApiId: $(TG_API_ID)
        TGApiHash: $(TG_API_HASH)
        # PRODUCT §2.13: optional. Set TGS_PUBLIC_ORIGIN in Secrets.xcconfig only if you
        # are running your own public reader; unset (the default) substitutes to empty and
        # `Copy Link` falls back to t.me. Whatever lands here is validated at runtime —
        # scheme and host or nothing, which is what catches the `https:` an unescaped `//`
        # leaves behind. See PublicLink in Sources/Protocol/Links.swift.
        TGSPublicOrigin: $(TGS_PUBLIC_ORIGIN)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.social-networking
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - CormorantGaramond-Medium.ttf
          - CormorantGaramond-SemiBold.ttf
          - CormorantGaramond-Bold.ttf
          - CormorantGaramond-MediumItalic.ttf
          - KaushanScript-Regular.ttf
          - Inconsolata-Regular.ttf
          - Inconsolata-SemiBold.ttf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: false
        NSPhotoLibraryUsageDescription: tgsocial attaches a photo to your post.
        NSPhotoLibraryAddUsageDescription: tgsocial saves photos you choose to your library.

  tgsocialTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    # The Connector suite only exists on Catalyst (the bridge is not compiled
    # in anywhere else), so the test bundle has to build for Catalyst too.
    supportsMacCatalyst: true
    sources:
      - path: Tests
      - path: ../docs/card-vectors.json
        buildPhase: resources
    dependencies:
      - target: tgsocial
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.lucianlabs.tgsocialTests
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/tgsocial.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/tgsocial
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  tgsocial:
    build:
      targets:
        tgsocial: all
        tgsocialTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - tgsocialTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
