# server/nginx.conf — a complete nginx for one tgsocial host.
#
# docker-compose.yml mounts this over /etc/nginx/nginx.conf and ../web over
# /var/www/tgsocial. It is an example: everything in it is yours to change
# except the /tg/s/ contract, and that does not live here — it lives in
# web/nginx-public.conf and is `include`d at the bottom, not copied, so a
# `git pull` of the bundle brings its fixes with it (PUBLIC.md §1).

worker_processes 1;                 # a lens over Telegram, not a load balancer

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;  # carries application/wasm since 1.21 (web/README.md)
    default_type application/octet-stream;
    sendfile on;

    # A host holds nothing, and that includes who read what. nginx's default
    # is a line per request; off is the honest default for a page whose
    # privacy story is "there is no log" (docs/HOSTING.md §1). Turn it on if
    # you need it, and say so on the page.
    access_log off;

    # The sixty-second memory the /tg/s/ location depends on (PUBLIC.md §1).
    # `proxy_cache_path` is http-scope only, which is why it is declared here
    # and not beside the location. docker-compose.yml puts this path on tmpfs
    # so "nothing touches disk" is literal rather than approximate.
    proxy_cache_path /var/cache/nginx/tgpreview levels=1:2
                     keys_zone=tgpreview:10m max_size=256m
                     inactive=10m use_temp_path=off;

    # /tg/s/ fetches Telegram on behalf of anyone who asks. This zone is the
    # difference between a public reader and an open proxy that gets your
    # address blocked by t.me. The location refuses to load without it.
    limit_req_zone $binary_remote_addr zone=tgpreview_req:10m rate=5r/s;

    # $binary_remote_addr is the TCP peer. Put a TLS terminator in front of
    # this nginx and the peer is the terminator: every reader shares its one
    # bucket of 5 r/s + 10, and the instance starts answering 429 at ten reads
    # in a burst — three people opening a node with four feeds each. These
    # three lines make the key the address the terminator forwards instead.
    # Trust ONLY the terminator: trust everyone and a reader forges the header
    # and the limiter is decoration.
    #
    #   set_real_ip_from 127.0.0.1;        # the terminator's address, or its docker network
    #   real_ip_header X-Forwarded-For;    # what Caddy, Traefik, HAProxy (option forwardfor) send
    #   real_ip_recursive on;
    #
    # Docker Desktop shows the same collapse for a different reason: published
    # ports reach the container from the VM's forwarder, one address for every
    # reader. That is the Mac, not this file; Linux hands nginx the real peer.

    server {
        # Plain HTTP on purpose: terminate TLS in front with whatever you
        # already run. TDLib's wss:// to Telegram goes browser → Telegram and
        # never through this server.
        listen 8080;

        root /var/www/tgsocial;
        index index.html;

        # The SPA fallback. /u/<name>, /f/<name>, /n/<id> are routes inside
        # index.html, not files on disk; a path that is not a file gets the
        # page and the page routes it.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # The contract: the /tg/s/ proxy, its header rewrites, its query and
        # path refusals, and the reasoning for each. One source of truth.
        include /var/www/tgsocial/nginx-public.conf;
    }
}
